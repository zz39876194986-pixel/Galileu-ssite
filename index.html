<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galileu</title>
<meta name="description" content="Galileu — assistente local, movido a curiosidade. Roda inteiramente no seu navegador.">
<meta name="theme-color" content="#0d1321">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" onerror="this.remove()">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <svg class="orbita" viewBox="0 0 34 34" xmlns="http://www.w3.org/2000/svg">
    <circle cx="17" cy="17" r="2.6" fill="#c99a3c"/>
    <circle cx="17" cy="17" r="12" fill="none" stroke="rgba(201,154,60,0.35)" stroke-width="1"/>
    <g class="ponto">
      <circle cx="29" cy="17" r="1.8" fill="#f2ead3"/>
    </g>
  </svg>
  <div class="titulo-bloco">
    <h1>Galileu</h1>
    <div class="tagline"><span class="ponto-status"></span>roda no seu navegador</div>
  </div>
  <button id="btn-menu" class="btn-icone" aria-label="Mais opções" aria-haspopup="true" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></svg>
  </button>
  <div id="menu-opcoes" class="menu-opcoes escondido">
    <button data-cmd="memoria">Memória</button>
    <button data-cmd="historico">Histórico</button>
    <button data-cmd="estatisticas">Estatísticas</button>
    <button data-cmd="seus principios">Princípios</button>
    <button data-cmd="ajuda">Todos os comandos</button>
  </div>
</header>

<div id="chat">
  <div class="vazio" id="vazio">Pergunte alguma coisa — força, gravidade, buraco negro, ou o que quiser.</div>
</div>

<form id="form">
  <button type="button" id="btn-atalhos" class="btn-icone" aria-label="Atalhos de comando" aria-haspopup="true" aria-expanded="false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <input id="entrada" type="text" placeholder="Escreva sua mensagem..." autocomplete="off" autofocus>
  <button type="submit" class="btn-enviar" aria-label="Enviar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/>
    </svg>
  </button>
  <div id="menu-atalhos" class="menu-opcoes escondido acima-do-input">
    <button data-cmd="aprenda: ">Ensinar algo</button>
    <button data-cmd="cofre exportar: ">Exportar cofre</button>
    <button data-cmd="cofre importar: ">Importar cofre</button>
    <button data-cmd="limpar historico">Limpar histórico</button>
  </div>
</form>

<script src="app.js"></script>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const entrada = document.getElementById('entrada');
const vazio = document.getElementById('vazio');
const botao = form.querySelector('.btn-enviar');
const btnMenu = document.getElementById('btn-menu');
const menuOpcoes = document.getElementById('menu-opcoes');
const btnAtalhos = document.getElementById('btn-atalhos');
const menuAtalhos = document.getElementById('menu-atalhos');

function rolar() { chat.scrollTop = chat.scrollHeight; }

function avatarSvg() {
  return '<svg width="22" height="22" viewBox="0 0 34 34" class="avatar" aria-hidden="true">' +
    '<circle cx="17" cy="17" r="2.6" fill="#c99a3c"/>' +
    '<circle cx="17" cy="17" r="12" fill="none" stroke="rgba(201,154,60,0.35)" stroke-width="1"/>' +
    '<circle cx="29" cy="17" r="1.8" fill="#f2ead3"/></svg>';
}

function adicionarLinha(quem, texto) {
  if (vazio) vazio.remove();
  const linha = document.createElement('div');
  linha.className = 'linha ' + quem;
  if (quem === 'galileu') linha.innerHTML = avatarSvg();
  const bolha = document.createElement('div');
  bolha.className = 'bolha';
  bolha.textContent = texto;
  linha.appendChild(bolha);
  chat.appendChild(linha);
  rolar();
}

function mostrarDigitando() {
  const linha = document.createElement('div');
  linha.className = 'linha galileu';
  linha.id = 'digitando-linha';
  linha.innerHTML = avatarSvg() + '<div class="bolha"><div class="digitando"><span></span><span></span><span></span></div></div>';
  chat.appendChild(linha);
  rolar();
}

function removerDigitando() {
  const el = document.getElementById('digitando-linha');
  if (el) el.remove();
}

function fecharMenus() {
  menuOpcoes.classList.add('escondido');
  menuAtalhos.classList.add('escondido');
  btnMenu.setAttribute('aria-expanded', 'false');
  btnAtalhos.setAttribute('aria-expanded', 'false');
}

function enviarTexto(texto) {
  if (!texto.trim()) return;
  adicionarLinha('voce', texto);
  entrada.value = '';
  entrada.disabled = true;
  botao.disabled = true;
  mostrarDigitando();

  const COMANDOS_CONHECIDOS = new Set([
    'memoria', 'historico', 'limpar memoria', 'limpar historico',
    'resumo historico', 'resumo do historico', 'estatisticas',
    'limpar estatisticas', 'ajuda', 'help',
  ]);

  setTimeout(async () => {
    let resposta;
    const inicio = performance.now();
    try {
      resposta = await pensar(texto);
    } catch (erro) {
      resposta = 'Ocorreu um erro ao processar: ' + erro.message;
    }
    const tempoMs = performance.now() - inicio;
    const comandoNorm = normalizar(texto);
    const comando = COMANDOS_CONHECIDOS.has(comandoNorm) ? comandoNorm : null;
    try { registrarEstatistica(texto, resposta, tempoMs, comando); } catch (e) {}
    adicionarHistorico(texto, resposta);
    removerDigitando();
    adicionarLinha('galileu', resposta);
    entrada.disabled = false;
    botao.disabled = false;
    entrada.focus();
  }, 350 + Math.random() * 300);
}

form.addEventListener('submit', (ev) => {
  ev.preventDefault();
  enviarTexto(entrada.value);
});

btnMenu.addEventListener('click', (ev) => {
  ev.stopPropagation();
  menuAtalhos.classList.add('escondido');
  const abrir = menuOpcoes.classList.contains('escondido');
  menuOpcoes.classList.toggle('escondido');
  btnMenu.setAttribute('aria-expanded', String(abrir));
});

btnAtalhos.addEventListener('click', (ev) => {
  ev.stopPropagation();
  menuOpcoes.classList.add('escondido');
  const abrir = menuAtalhos.classList.contains('escondido');
  menuAtalhos.classList.toggle('escondido');
  btnAtalhos.setAttribute('aria-expanded', String(abrir));
});

document.addEventListener('click', fecharMenus);

menuOpcoes.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => {
    fecharMenus();
    enviarTexto(btn.dataset.cmd);
  });
});

menuAtalhos.querySelectorAll('button').forEach((btn) => {
  btn.addEventListener('click', () => {
    fecharMenus();
    entrada.value = btn.dataset.cmd;
    entrada.focus();
  });
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>

</body>
</html>
